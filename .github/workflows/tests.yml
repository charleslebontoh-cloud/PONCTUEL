name: Tests Ponctuel
# Rejoue les 12 scénarios (GPS, trafic et cartes simulés) à chaque modification et chaque jour.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Scénarios
        run: npm test 2>&1 | tee test-report.txt
        shell: bash
      - name: Ouvrir une alerte en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Tests en échec ($(date -u +%F))" --label bug --body "$(printf 'Le contrôle automatique a détecté une régression.\n\n```\n%s\n```\n' "$(tail -60 test-report.txt)")" || gh issue create --title "Tests en échec ($(date -u +%F))" --body "$(tail -60 test-report.txt)"
