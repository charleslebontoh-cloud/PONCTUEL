<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Ponctuel</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Concept : cockpit de nuit. Carte vectorielle 3D plein écran, panneaux en verre dépoli,
   une seule couleur signal (ambre « horloge ») pour le temps, rouge/orange réservés au trafic, bleu électrique pour la route. */
:root{
  --ink:#0b1220; --glass:rgba(16,24,38,.72); --glass-2:rgba(30,42,62,.6); --line:rgba(140,170,210,.18);
  --text:#eef3fa; --muted:#93a4ba;
  --signal:#ffb21e; --signal-ink:#1d1300;
  --go:#2fd27a; --slow:#ff9a2e; --jam:#ff4b4b; --route:#3d9bff; --route-2:#40e0ff; --alt:#8193ad;
  --display:"Archivo",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --r:16px; --shadow:0 12px 34px rgba(0,0,0,.45); --blur:saturate(160%) blur(18px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --ink:#e9eef5; --glass:rgba(255,255,255,.78); --glass-2:rgba(236,241,248,.8); --line:rgba(40,60,90,.14);
  --text:#0b1220; --muted:#55657b; --signal:#e08a00; --signal-ink:#fff; --route:#1e6fe6; --route-2:#1aa7d6; --alt:#8a98ab;
  --shadow:0 12px 30px rgba(20,35,60,.18); color-scheme:light}}
:root[data-theme="light"]{
  --ink:#e9eef5; --glass:rgba(255,255,255,.78); --glass-2:rgba(236,241,248,.8); --line:rgba(40,60,90,.14);
  --text:#0b1220; --muted:#55657b; --signal:#e08a00; --signal-ink:#fff; --route:#1e6fe6; --route-2:#1aa7d6; --alt:#8a98ab;
  --shadow:0 12px 30px rgba(20,35,60,.18); color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:15px/1.4 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#map{position:fixed;inset:0;z-index:0;background:var(--ink)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-stretch:88%}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---- Barre de recherche ---- */
#top{position:fixed;z-index:500;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  max-width:500px;border-radius:var(--r);padding:10px;animation:drop .45s ease-out}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.brand h1{margin:0;font:800 19px/1 var(--display);font-stretch:112%;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand h1 i{width:18px;height:18px;border-radius:50%;border:3px solid var(--signal);position:relative;display:inline-block}
.brand h1 i::after{content:"";position:absolute;left:5px;top:1px;width:2px;height:6px;background:var(--signal);border-radius:2px;transform-origin:50% 100%;animation:hand 6s linear infinite}
@keyframes hand{to{transform:rotate(360deg)}}
.clock{font:700 15px var(--display);color:var(--signal)}
.fields{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.field{position:relative;display:flex;align-items:center;gap:8px;background:var(--glass-2);border:1px solid var(--line);border-radius:11px;padding:0 10px;min-width:0;transition:border-color .2s}
.field:focus-within{border-color:var(--route)}
.field b{font:800 12px var(--display);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none}
.field.a b{background:var(--route);color:#fff}.field.b b{background:var(--signal);color:var(--signal-ink)}
.field input{border:0;background:transparent;outline:none;padding:11px 0;width:100%;min-width:0}
#swap{grid-row:1/3;grid-column:2;height:100%;width:40px;border-radius:11px;border:1px solid var(--line);background:var(--glass-2);font-size:18px;transition:transform .3s}
#swap:active{transform:rotate(180deg)}
.row2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.arrive{display:flex;align-items:center;gap:6px;background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px}
.arrive input{background:transparent;border:0;outline:none;width:108px;font:700 14px var(--display);color:var(--signal)}
#go{margin-left:auto;background:linear-gradient(135deg,var(--signal),#ff8a00);color:var(--signal-ink);border:0;border-radius:999px;padding:9px 20px;font:800 14px var(--display);letter-spacing:.03em;box-shadow:0 6px 18px rgba(255,160,20,.35);transition:transform .15s}
#go:active{transform:scale(.95)}
#suggest{position:absolute;left:10px;right:10px;top:100%;margin-top:6px;border-radius:12px;overflow:hidden;max-height:50vh;overflow-y:auto;animation:pop .18s ease-out}
#suggest button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent}
#suggest button small{display:block;color:var(--muted)}
#suggest button:hover,#suggest button:focus{background:var(--glass-2)}
#hint{margin-top:8px;font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#hint .chip{font-size:12px;padding:5px 10px}

/* ---- Contrôles carte ---- */
#fab{position:fixed;z-index:450;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(var(--sheet-h,140px) + 14px);display:flex;flex-direction:column;gap:8px;transition:bottom .3s}
.ctl{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:800 12px var(--display);position:relative;transition:transform .15s,border-color .2s,color .2s}
.ctl:active{transform:scale(.92)}
.ctl.on{border-color:var(--signal);color:var(--signal)}
.ctl svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lstack{position:fixed;z-index:460;left:max(10px,env(safe-area-inset-left,0px));top:var(--top-b,240px);display:flex;flex-direction:column;gap:8px;transition:top .3s}
#compass{width:52px;height:52px;border-radius:50%;padding:0;margin-bottom:14px}
#compass .dial{width:44px;height:44px;border-radius:50%;position:relative;transition:transform .12s linear}
#compass .dial::before{content:"";position:absolute;left:50%;top:5px;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:17px solid var(--jam)}
#compass .dial::after{content:"";position:absolute;left:50%;bottom:5px;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:17px solid var(--muted)}
#compass .n{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font:900 9px var(--display);color:var(--jam)}
#compass small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font:800 10px var(--display);color:var(--muted);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#recenter{position:fixed;z-index:620;left:50%;transform:translateX(-50%);bottom:calc(var(--recenter-b,160px));border:0;border-radius:999px;padding:12px 20px;font:800 14px var(--display);letter-spacing:.03em;
  background:var(--route);color:#fff;box-shadow:0 8px 24px rgba(30,110,255,.45);display:flex;gap:8px;align-items:center;animation:pop .25s ease-out}
#recenter svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---- Feuille du bas ---- */
#sheet{position:fixed;z-index:480;left:0;right:0;bottom:0;max-height:var(--sheet-max,55vh);border-radius:20px 20px 0 0;border-bottom:0;
  padding:6px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px));overflow-y:auto;max-width:640px;margin:0 auto;animation:rise .45s ease-out;transition:transform .3s}
#sheet.min{transform:translateY(calc(100% - 64px - env(safe-area-inset-bottom,0px)))}
#sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px;cursor:grab;border:0;display:block;padding:0}
.tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 10px;border-radius:9px;color:var(--muted);font:700 13px var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:background .2s,color .2s}
.tabs button.on{background:var(--glass-2);color:var(--text)}
#pane > *{animation:rise .35s ease-out backwards}
#pane > *:nth-child(2){animation-delay:.04s}#pane > *:nth-child(3){animation-delay:.08s}#pane > *:nth-child(4){animation-delay:.12s}#pane > *:nth-child(5){animation-delay:.16s}
.empty{color:var(--muted);font-size:14px;padding:6px 2px 4px}
.empty strong{color:var(--text)}
h3{font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}

.plan{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--glass-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.plan::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.plan .big{grid-row:1/3;font:900 40px/1 var(--display);font-stretch:80%;color:var(--signal);font-variant-numeric:tabular-nums}
.plan .big small{font-size:14px;font-stretch:100%;margin-left:2px}
.plan .l1{font-weight:700}.plan .l2{color:var(--muted);font-size:13px}
.plan.late .big{color:var(--jam)}.plan.ok .big{color:var(--go)}

.route{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 0;margin-bottom:8px;background:transparent;width:100%;text-align:left;overflow:hidden;transition:background .2s,border-color .2s,transform .15s}
.route:active{transform:scale(.985)}
.route .stripe{grid-row:1/4;border-radius:0 4px 4px 0;background:var(--alt)}
.route.sel{border-color:var(--route);background:var(--glass-2)}
.route.sel .stripe{background:linear-gradient(var(--route),var(--route-2))}
.route .t{font:800 26px/1 var(--display);font-stretch:85%;font-variant-numeric:tabular-nums}
.route .t small{font-size:14px;font-weight:600}
.route .eta{text-align:right;font:700 15px var(--display);color:var(--signal)}
.route .meta{color:var(--muted);font-size:13px;margin-top:4px;grid-column:2/4}
.route .bar{grid-column:2/4;height:6px;border-radius:6px;margin-top:8px;background:var(--go);position:relative;overflow:hidden}
.route .bar span{position:absolute;top:0;bottom:0}
.badge{display:inline-block;font:800 11px var(--display);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;margin-right:4px;vertical-align:2px}
.badge.best{background:var(--go);color:#062312}.badge.jam{background:var(--jam);color:#fff}.badge.slow{background:var(--slow);color:#2a1600}
.jam-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px;margin-bottom:6px}
.jam-item i{width:10px;height:36px;border-radius:4px;flex:none;background:var(--jam)}
.jam-item i.mod{background:var(--slow)}
.jam-item div{min-width:0;flex:1}
.jam-item small{color:var(--muted);display:block}
.jam-item span{font:700 12px var(--display);color:var(--signal);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--glass-2);border-radius:11px;padding:10px 14px;font-weight:700;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--route),var(--route-2));color:#fff;border-color:transparent;font-family:var(--display);font-weight:800;letter-spacing:.03em;box-shadow:0 8px 22px rgba(30,110,255,.35)}
.btn.wide{width:100%;padding:14px}
.btn.danger{color:var(--jam)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.place{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.place .ic{width:34px;height:34px;border-radius:10px;background:var(--glass-2);display:grid;place-items:center;font:800 13px var(--display);flex:none;color:var(--signal)}
.place div{flex:1;min-width:0}
.place b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place small{color:var(--muted)}
.place .act{display:flex;gap:4px}
.place .act button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 8px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--glass-2);border-radius:12px;padding:10px}
.stat b{display:block;font:800 24px var(--display);font-stretch:85%;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:46px;margin-top:6px}
.hours i{background:linear-gradient(var(--signal),#ff7a00);border-radius:2px 2px 0 0;min-height:2px;opacity:.9}
.hours-l{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}

label.set{display:block;margin:10px 0}
label.set span{display:block;font-weight:700;margin-bottom:4px}
label.set small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
label.set input[type=text],label.set input[type=password]{width:100%;background:var(--glass-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle input{width:20px;height:20px;accent-color:var(--signal)}
.note{background:var(--glass-2);border-left:3px solid var(--signal);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0}
.note b{color:var(--text)}.note a{color:var(--signal)}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vopt{border:1px solid var(--line);background:var(--glass-2);border-radius:12px;padding:8px 4px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:700}
.vopt svg{width:40px;height:40px}
.vopt.on{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal) inset}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--signal)}
.seg{display:flex;background:var(--glass-2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font:700 12px var(--display);color:var(--muted)}
.seg button.on{background:var(--route);color:#fff}

/* ---- Vue satellite du bouchon ---- */
#sat{position:fixed;z-index:700;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));width:min(390px,calc(100vw - 20px));border:2px solid var(--jam);border-radius:var(--r);overflow:hidden;animation:pop .3s ease-out}
#sat header{display:flex;align-items:flex-start;gap:8px;padding:10px 12px}
#sat header div{flex:1;min-width:0}
#sat header b{display:block;font:800 15px var(--display)}
#sat header small{color:var(--muted)}
#sat .live{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--display);letter-spacing:.06em;color:var(--jam);text-transform:uppercase}
#sat .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--jam);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
#satmap{height:250px;background:#000}
@media (max-height:760px){#satmap{height:185px}}
#sat footer{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap;align-items:center}
#sat footer .btn{padding:7px 10px;font-size:13px}
#sat footer a{color:var(--signal);font-size:13px;margin-left:auto}
#sat .x{border:0;background:var(--glass-2);border-radius:8px;width:30px;height:30px;font-size:16px}
#sat .cap{font-size:11px;color:var(--muted);padding:0 12px 8px}

/* ---- Navigation ---- */
#nav{position:fixed;z-index:600;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));animation:drop .4s ease-out;pointer-events:none}
#nav > *{pointer-events:auto}
#nav .instr{background:linear-gradient(135deg,#1658c8,#1e7bff 60%,#20a4ff);color:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 34px rgba(16,80,200,.45);max-width:560px}
#nav .man{width:58px;height:58px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.14);border-radius:14px}
#nav .man svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
#nav .d{font:900 32px/1 var(--display);font-stretch:85%;white-space:nowrap}
#nav .m{font-weight:700;font-size:16px;min-width:0;margin-top:2px}
#nav .then{max-width:560px;margin-top:6px;display:inline-flex;gap:8px;align-items:center;background:#0f3f94;color:#dbe8ff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700}
#nav .then svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#nav .warn{margin-top:8px;max-width:560px;background:var(--jam);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:var(--shadow);animation:pop .3s ease-out}
#navbar{position:fixed;z-index:600;left:0;right:0;bottom:0;border-radius:20px 20px 0 0;border-bottom:0;animation:rise .4s ease-out;
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px))}
#navbar .row{display:flex;align-items:center;gap:14px}
#navbar .k{flex:1;display:flex;gap:18px;flex-wrap:wrap}
#navbar .k div b{display:block;font:800 22px/1.1 var(--display);font-stretch:85%;font-variant-numeric:tabular-nums}
#navbar .k div small{color:var(--muted);font-size:12px}
#navbar .eta b{color:var(--go)}
#navbar .eta.late b{color:var(--jam)}
#navbar .prog{height:5px;border-radius:5px;background:var(--line);margin-bottom:10px;overflow:hidden}
#navbar .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--route),var(--route-2));border-radius:5px;transition:width 1s linear}
#speed{position:fixed;z-index:600;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:72px;height:72px;border-radius:50%;display:grid;place-items:center;text-align:center}
#speed b{font:900 26px/1 var(--display);display:block;font-variant-numeric:tabular-nums}
#speed small{font-size:10px;color:var(--muted)}
#speed svg{position:absolute;inset:-1px;width:74px;height:74px;transform:rotate(135deg)}
#toast{position:fixed;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--text);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100vw - 32px);box-shadow:var(--shadow);animation:pop .2s ease-out}

/* ---- Marqueurs ---- */
.puck{width:22px;height:22px;position:relative}
.puck i{position:absolute;inset:0;border-radius:50%;background:var(--route);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.puck::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(61,155,255,.25);animation:halo 2s ease-out infinite}
@keyframes halo{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.4);opacity:0}}
.puck .beam{position:absolute;left:50%;bottom:50%;width:70px;height:70px;margin-left:-35px;transform-origin:50% 100%;
  background:conic-gradient(from -30deg at 50% 100%,rgba(61,155,255,.45),rgba(61,155,255,0) 60deg,transparent 0);border-radius:50% 50% 0 0;pointer-events:none}
.veh{width:76px;height:76px;display:grid;place-items:center;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.veh svg{width:76px;height:76px}
.pin{font:800 12px var(--display);width:28px;height:28px;border-radius:9px 9px 9px 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4);animation:pop .4s ease-out}
.pin span{transform:rotate(45deg)}
.pin.a{background:var(--route);color:#fff}.pin.b{background:var(--signal);color:var(--signal-ink)}
.jampin{width:28px;height:28px;border-radius:50%;background:var(--jam);border:2px solid #fff;color:#fff;display:grid;place-items:center;font:900 14px var(--display);animation:ring 1.6s infinite;cursor:pointer}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,75,75,.7)}70%{box-shadow:0 0 0 16px rgba(255,75,75,0)}100%{box-shadow:0 0 0 0 rgba(255,75,75,0)}}
.placepin{width:16px;height:16px;border-radius:5px;background:var(--signal);border:2px solid var(--ink);transform:rotate(45deg);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--sheet-h,140px) - 4px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){#lstack{left:auto;right:max(10px,env(safe-area-inset-right,0px));top:20px} #sheet{left:12px;right:auto;width:470px;bottom:12px;border-radius:20px;border-bottom:1px solid var(--line);max-height:calc(100vh - 230px)} #top{width:470px}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Carte"></div>

<section id="top" class="glass">
  <div class="brand"><h1><i></i>Ponctuel</h1><span class="clock num" id="clock">--:--</span></div>
  <div class="fields">
    <label class="field a"><b>A</b><input id="inA" placeholder="Ma position" autocomplete="off" aria-label="Départ"></label>
    <button id="swap" title="Inverser départ et arrivée" aria-label="Inverser">⇅</button>
    <label class="field b"><b>B</b><input id="inB" placeholder="Où allez-vous ?" autocomplete="off" aria-label="Destination"></label>
  </div>
  <div id="suggest" class="glass" hidden></div>
  <div class="row2">
    <label class="arrive" title="Heure à laquelle vous devez être arrivé">Arriver à <input type="time" id="arriveAt"></label>
    <button class="chip" id="chipHome" hidden>Maison</button>
    <button class="chip" id="chipWork" hidden>Travail</button>
    <button id="go">Y aller</button>
  </div>
  <div id="hint" hidden></div>
</section>

<div id="lstack">
  <button id="compass" class="ctl glass" title="Boussole : nord en haut ou cap en haut" aria-label="Boussole"><div class="dial" id="dial"><span class="n">N</span></div><small id="compassLbl">NORD</small></button>
  <button class="ctl glass" id="bLayer" title="Changer de fond de carte" aria-label="Fond de carte">PLAN</button>
  <button class="ctl glass" id="bHeat" title="Mes zones lentes apprises" aria-label="Zones lentes apprises"><svg viewBox="0 0 24 24"><path d="M12 22c4-3 7-6.5 7-11a7 7 0 0 0-14 0c0 4.5 3 8 7 11z"/><circle cx="12" cy="11" r="2.5"/></svg></button>
</div>

<div id="fab">
  <button class="ctl glass" id="bLocate" title="Recentrer sur ma position" aria-label="Recentrer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="ctl glass" id="b3d" title="Vue 2D / 3D" aria-label="Vue 3D">3D</button>
  <button class="ctl glass" id="bTraffic" title="Trafic en direct" aria-label="Trafic en direct"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="17" r="1.5"/></svg></button>
</div>

<button id="recenter" hidden><svg viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z"/></svg>Recentrer</button>

<section id="sheet" class="glass" aria-label="Panneau">
  <button class="grab" id="grab" aria-label="Réduire ou agrandir le panneau"></button>
  <nav class="tabs" role="tablist">
    <button data-tab="trip" class="on">Trajet</button>
    <button data-tab="places">Mes lieux</button>
    <button data-tab="stats">Ponctualité</button>
    <button data-tab="settings">Réglages</button>
  </nav>
  <div id="pane"></div>
</section>

<section id="sat" class="glass" hidden aria-live="polite">
  <header>
    <div><span class="live">Bouchon détecté</span><b id="satTitle">—</b><small id="satSub"></small></div>
    <button class="x" id="satClose" aria-label="Fermer la vue satellite">✕</button>
  </header>
  <div id="satmap"></div>
  <div class="cap" id="satCap">Vue satellite haute résolution + trafic en direct superposé.</div>
  <footer>
    <button class="btn" id="satPrev" aria-label="Précédent">◀</button><span class="num" id="satIdx">1/1</span><button class="btn" id="satNext" aria-label="Suivant">▶</button>
    <button class="btn" id="satZoom">Voir sur la carte</button>
    <a id="satEarth" href="#" target="_blank" rel="noopener">Google Earth 3D ↗</a>
  </footer>
</section>

<div id="nav" hidden>
  <div class="instr"><div class="man" id="nIcon"></div><div style="min-width:0"><div class="d num" id="nDist">—</div><div class="m" id="nMsg">Calcul…</div></div></div>
  <div class="then" id="nThen" hidden></div>
  <div class="warn" id="nWarn" hidden></div>
</div>
<div id="speed" class="glass" hidden><svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="33" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="155 300" stroke-linecap="round"/><circle id="spdArc" cx="37" cy="37" r="33" fill="none" stroke="var(--go)" stroke-width="4" stroke-dasharray="0 300" stroke-linecap="round" style="transition:stroke-dasharray .6s,stroke .3s"/></svg><div><b id="spd">0</b><small>km/h</small></div></div>
<div id="navbar" class="glass" hidden>
  <div class="prog"><i id="nProg"></i></div>
  <div class="row">
    <div class="k">
      <div class="eta" id="nEtaBox"><b id="nEta">--:--</b><small>arrivée</small></div>
      <div><b id="nLeft">--</b><small>restant</small></div>
      <div><b id="nKm">--</b><small>km</small></div>
    </div>
    <button class="btn" id="nMute" aria-label="Couper la voix">🔊</button>
    <button class="btn danger" id="nStop">Arrêter</button>
  </div>
</div>
<div id="toast" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
